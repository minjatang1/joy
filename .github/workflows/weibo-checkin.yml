name: 微博超话每日签到
on:
  schedule:
    # UTC 00:00 = Asia/Shanghai 08:00. GitHub may delay scheduled jobs.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 仅检查超话配置，不执行签到
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: weibo-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Sign in
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          WEIBO_TOPIC_ZHANG_WONYOUNG: ${{ vars.WEIBO_TOPIC_ZHANG_WONYOUNG || '1008080637ba9df8242042bba48c63aa59f947' }}
          WEIBO_TOPIC_IROHA: ${{ vars.WEIBO_TOPIC_IROHA || '1008080910a89e285df865827cd187911623bc' }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        shell: bash
        run: |
          if [[ "$VALIDATE_ONLY" == "true" ]]; then
            python weibo_checkin.py --validate-only
          else
            python weibo_checkin.py
          fi
